<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validación de Formulario</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            color: goldenrod;
            margin-top: 50px;
            background-color: #aef3e7;
        }
        #botonEnviar {
            background-color: #8DDA8B;
            color: blue;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .mensaje {
            margin-top: 20px;
            font-size: 24px;
            color: #f8eef8;
        }
    </style>
</head>
<body>

    <h1>Formulario de Nombre</h1>
    <input type="text" id="nombre" placeholder="Ingresa tu Nombre">
    <button id="botonEnviar">Enviar</button>
    <p class="mensaje"></p>

    <script src="prueba_de_java.app.js"></script>

</body>
</html>
